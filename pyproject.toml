[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "model-bench"
version = "0.1.0"
description = "Benchmark local LLM inference across runtimes: tokens per second, time to first token and memory ceiling, at fixed prompts."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Prabesh Sharma" }]
keywords = ["llm", "benchmark", "inference", "ollama", "tokens-per-second", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Benchmark",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.6", "mypy>=1.8"]

[project.scripts]
model-bench = "model_bench.cli:main"

[project.urls]
Homepage = "https://github.com/hellpuffyt/model-bench"
Issues = "https://github.com/hellpuffyt/model-bench/issues"
Changelog = "https://github.com/hellpuffyt/model-bench/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/model_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 90
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
