name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: pytest
        run: pytest -q

  quality:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: mypy (strict)
        run: mypy

      - name: coverage
        run: pytest -q --cov=model_bench --cov-report=term-missing

  dogfood:
    name: replay this repository's own recorded run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install
        run: python -m pip install --upgrade pip && pip install -e .

      # fixtures/ollama-llama32-3b.json is a real recording of llama3.2:3b
      # on Ollama. Replaying it drives the whole harness — the same timing
      # loop, statistics and formatter a live run uses — through a virtual
      # clock, so the output must be identical to the byte on every
      # machine. If it is not, some measurement has stopped being
      # deterministic and every number this tool prints is suspect.
      - name: replay the committed recording
        run: |
          set -euo pipefail
          actual=$(model-bench replay fixtures/ollama-llama32-3b.json --format csv)
          expected=$(cat <<'EOF'
          runtime,model,prompt,repetition,ttft_s,total_s,output_tokens,token_source,tokens_per_second
          ollama,llama3.2:3b,tiny,0,0.022835,0.036630,3,reported,144.9874
          ollama,llama3.2:3b,tiny,1,0.017123,0.032298,3,reported,131.8018
          ollama,llama3.2:3b,tiny,2,0.025187,0.032849,3,reported,261.0216
          ollama,llama3.2:3b,short,0,0.020645,0.750122,128,reported,174.0971
          ollama,llama3.2:3b,short,1,0.019157,0.745672,128,reported,174.8071
          ollama,llama3.2:3b,short,2,0.045752,0.751863,128,reported,179.8584
          EOF
          )
          if [ "$actual" != "$expected" ]; then
            echo "replay output changed:"
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi

      # A recording is not a live run, and the tool must never let one be
      # mistaken for one.
      - name: the replay is labelled as a replay
        run: |
          set -euo pipefail
          model-bench replay fixtures/ollama-llama32-3b.json \
            | grep -q "replay of fixtures/ollama-llama32-3b.json (not a live run)"

      # With no runtime listening, the tool must fail rather than invent
      # numbers. Port 1 has nothing on it in a GitHub runner.
      - name: an unreachable runtime is an error, not an estimate
        run: |
          set -euo pipefail
          if model-bench run --model nothing --endpoint http://127.0.0.1:1 \
               >stdout.txt 2>stderr.txt; then
            echo "expected a non-zero exit"; exit 1
          fi
          test ! -s stdout.txt
          grep -q "is unavailable" stderr.txt
          grep -q "nothing was estimated in its place" stderr.txt
